name: arXiv Preflight

on:
  push:
    paths:
      - "arxiv/**"
      - "paper/manuscript.md"
      - ".github/workflows/arxiv.yml"
  pull_request:
    paths:
      - "arxiv/**"
      - "paper/manuscript.md"
      - ".github/workflows/arxiv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arXiv PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures

      - name: Static arXiv preflight
        run: python arxiv/build_check.py

      - name: Compile PDF
        working-directory: arxiv
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Verify PDF
        run: test -s arxiv/main.pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safeocr-arxiv-pdf
          path: arxiv/main.pdf
          if-no-files-found: error
          retention-days: 14
