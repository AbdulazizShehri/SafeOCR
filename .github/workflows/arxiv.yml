name: arXiv Preflight

on:
  push:
    paths:
      - "arxiv/**"
      - "paper/manuscript.md"
      - ".github/workflows/arxiv.yml"
  pull_request:
    paths:
      - "arxiv/**"
      - "paper/manuscript.md"
      - ".github/workflows/arxiv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arXiv PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures

      - name: Static arXiv preflight
        run: python arxiv/build_check.py

      - name: Compile PDF
        working-directory: arxiv
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Verify PDF
        run: test -s arxiv/main.pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safeocr-arxiv-pdf
          path: arxiv/main.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Build clean submission source ZIP
        working-directory: arxiv
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          source_names = ("main.tex", "references.bib")
          archive_path = Path("safeocr-arxiv-source.zip")
          with ZipFile(archive_path, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for name in source_names:
                  content = Path(name).read_bytes()
                  assert content, f"Empty source file: {name}"
                  info = ZipInfo(name, date_time=(2020, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, content, compress_type=ZIP_DEFLATED, compresslevel=9)

          with ZipFile(archive_path) as archive:
              assert archive.namelist() == list(source_names)
              assert archive.testzip() is None
              assert all(archive.getinfo(name).file_size > 0 for name in source_names)
          print(f"Verified {archive_path} with exactly: {', '.join(source_names)}")
          PY
          sha256sum safeocr-arxiv-source.zip

      - name: Upload clean submission source ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safeocr-arxiv-source
          path: arxiv/safeocr-arxiv-source.zip
          if-no-files-found: error
          retention-days: 14
