name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@7999b86c43a865dc79d8923397f35af22de63401
      - name: Analyze
        uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401
        with:
          category: "/language:python"
