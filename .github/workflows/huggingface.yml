name: Hugging Face Viewer

on:
  pull_request:
    paths:
      - "huggingface/**"
      - "scripts/prepare_hf_viewer.py"
      - "tests/test_huggingface_viewer.py"
      - ".github/workflows/huggingface.yml"
  push:
    branches: [main]
    paths:
      - "huggingface/**"
      - "scripts/prepare_hf_viewer.py"
      - "tests/test_huggingface_viewer.py"
      - ".github/workflows/huggingface.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-viewer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install viewer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub>=0.35,<2" "datasets>=4,<5" pillow

      - name: Download canonical SafeOCR-LabGold
        run: |
          hf download MedScaleAI/SafeOCR-LabGold             --repo-type dataset             --local-dir /tmp/SafeOCR-LabGold
          rm -rf /tmp/SafeOCR-LabGold/viewer

      - name: Build derived viewer layer
        run: |
          python scripts/prepare_hf_viewer.py             --dataset-root /tmp/SafeOCR-LabGold

      - name: Verify viewer splits and metadata
        run: |
          python - <<'PY'
          from datasets import load_dataset

          root = "/tmp/SafeOCR-LabGold/viewer"
          ds = load_dataset(
              "parquet",
              data_files={
                  "calibration": f"{root}/calibration.parquet",
                  "evaluation": f"{root}/evaluation.parquet",
              },
          )

          expected_columns = {
              "image",
              "case_id",
              "role",
              "record_seed",
              "corruption_seed",
              "template",
              "image_sha256",
              "source_page_sha256",
              "synthetic_patient_id",
              "synthetic_report_id",
              "critical_field_count",
              "regions_json",
          }

          assert len(ds["calibration"]) == 24
          assert len(ds["evaluation"]) == 48
          assert set(ds["calibration"].column_names) == expected_columns
          assert set(ds["evaluation"].column_names) == expected_columns
          assert ds["calibration"][0]["role"] == "calibration"
          assert ds["evaluation"][0]["role"] == "evaluation"
          assert ds["calibration"][0]["image"] is not None
          assert ds["evaluation"][0]["image"] is not None
          PY
