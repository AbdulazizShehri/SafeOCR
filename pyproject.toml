[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "safeocr-health"
version = "0.1.0"
description = "Evidence-grounded verification infrastructure for clinical OCR."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Abdulaziz M. Alshehri" },
]
keywords = ["clinical-ocr", "healthcare-ai", "fhir", "verification", "selective-prediction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "Pillow==12.3.0",
  "ucumvert==0.3.2",
]

[project.urls]
Homepage = "https://github.com/AbdulazizShehri/SafeOCR"
Repository = "https://github.com/AbdulazizShehri/SafeOCR"
Issues = "https://github.com/AbdulazizShehri/SafeOCR/issues"

[project.optional-dependencies]
ocr = [
  "paddleocr==3.7.0",
  "onnxruntime==1.23.2",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
  "pyright>=1.1.408,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safeocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "runtime: requires installed OCR engines/models and Tesseract",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "error"
