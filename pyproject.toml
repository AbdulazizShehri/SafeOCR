[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "safeocr-health"
version = "0.0.1"
description = "Evidence-grounded verification infrastructure for clinical OCR."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "Pillow==12.3.0",
  "ucumvert==0.3.2",
]

[project.optional-dependencies]
ocr = [
  "paddleocr==3.7.0",
  "onnxruntime==1.23.2",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
  "pyright>=1.1.408,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safeocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "runtime: requires installed OCR engines/models and Tesseract",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "error"
